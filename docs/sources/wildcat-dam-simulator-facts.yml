name: Wildcat Dam Facts
facts:

# MODBUS CONNECTION FACTS

- trait: modbus.server.ip # IP address of the dam controller
  value: 127.0.0.1
- trait: modbus.server.port # Modbus TCP port
  value: 5020

# MODBUS READ FACTS

- trait: modbus.read_coil.start # First coil to read
  value: 0
- trait: modbus.read_coil.count # Number of coils to read
  value: 6
- trait: modbus.read_discrete.start # First discrete input to read
  value: 0
- trait: modbus.read_discrete.count # Number of discrete inputs to read
  value: 1
- trait: modbus.read_holding.start # First holding register to read
  value: 0
- trait: modbus.read_holding.count # Number of holding registers to read
  value: 7
- trait: modbus.read_input.start # First input register to read
  value: 0
- trait: modbus.read_input.count # Number of input registers to read
  value: 2

# MODBUS WRITE FACTS

- trait: modbus.write_coil.start # door_1 override enable
  value: 3
- trait: modbus.write_coil.start # door_1 position
  value: 0
- trait: modbus.write_coil.value # active
  value: 'ON'
- trait: modbus.write_coil.value # inactive
  value: 'OFF'
- trait: modbus.write_coil.values # all doors on
  value: ON,ON,ON
- trait: modbus.write_coil.values # all doors off
  value: OFF,OFF,OFF
- trait: modbus.write_register.start # threshold_2 register
  value: 5
- trait: modbus.write_register.value # threshold_2 low
  value: 5
- trait: modbus.write_register.values # thresholds 1-3
  value: 20,30,40
- trait: modbus.fuzz_coil.start # First coil to fuzz
  value: 0
- trait: modbus.fuzz_coil.end # Last coil to fuzz
  value: 5
- trait: modbus.fuzz_coil.count # Number of random coil writes
  value: 10
- trait: modbus.fuzz_coil.wait # Delay between coil writes (seconds)
  value: 0.1
- trait: modbus.fuzz_register.start # First holding register to fuzz
  value: 0
- trait: modbus.fuzz_register.end # Last holding register to fuzz
  value: 6
- trait: modbus.fuzz_register.count # Number of random register writes
  value: 10
- trait: modbus.fuzz_register.min # Minimum random register value
  value: 0
- trait: modbus.fuzz_register.max # Maximum random register value
  value: 999
- trait: modbus.fuzz_register.wait # Delay between register writes (seconds)
  value: 0.1
