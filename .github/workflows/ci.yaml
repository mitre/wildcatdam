name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt pytest==8.3.5 pytest-asyncio==0.25.3 pytest-cov==6.0.0
      - name: Run unit tests
        run: python -m pytest tests/

  smoke-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
      - name: Run smoke test
        run: bash docker/smoke-test.sh
      - name: Show logs
        if: failure()
        run: docker compose -f docker/docker-compose.yml --profile "*" logs
      - name: Tear down
        if: always()
        run: docker compose -f docker/docker-compose.yml --profile "*" down -v
