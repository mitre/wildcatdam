services:
  sim:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    networks:
      - ot-lab
    ports:
      - "5020:5020"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import socket; s=socket.create_connection(('localhost',5020),2); s.close()",
        ]
      interval: 5s
      timeout: 3s
      retries: 5

  web-hmi:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    entrypoint: ["python", "hmi.py", "--web", "--modbus-host", "sim", "--modbus-port", "5020", "--web-port", "8090"]
    networks:
      - ot-lab
    ports:
      - "8090:8090"
    depends_on:
      sim:
        condition: service_healthy

  caldera:
    build:
      context: ..
      dockerfile: docker/Dockerfile.caldera
    networks:
      - ot-lab
    ports:
      - "8888:8888"
      - "8443:8443"
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8888"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s

  agent:
    build:
      context: ..
      dockerfile: docker/Dockerfile.agent
    # linux/amd64: the modbus plugin's modbus_cli payload only ships an
    # x86_64 glibc build. On arm64 Docker hosts this forces Rosetta/QEMU
    # emulation with a real x86_64 root filesystem instead of a native
    # arm64 one, which is missing /lib64/ld-linux-x86-64.so.2 entirely.
    platform: linux/amd64
    networks:
      - ot-lab
    depends_on:
      caldera:
        condition: service_healthy
    environment:
      - CALDERA_SERVER=http://caldera:8888
      - AGENT_GROUP=red

networks:
  ot-lab:
    driver: bridge
